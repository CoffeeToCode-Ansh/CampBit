# Render Blueprint for CampBit.
# Assumes you already created the Postgres database in the Render dashboard.
# (To let Render create it too, see the commented "databases" block at the bottom.)
services:
  - type: web
    name: campbit
    runtime: python
    rootDir: website
    plan: free            # change to "starter" to avoid sleeping after 15 min idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL   # paste the Internal Database URL in the dashboard
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# --- Optional: let the Blueprint create the database as well ---
